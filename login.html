<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaloguj się - YogaFlow AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-container">
        <a href="index.html" class="auth-logo">YogaFlow<span>AI</span></a>
        <div class="auth-card">
            <h2>Witaj ponownie</h2>
            <p class="auth-subtitle">Zaloguj się na swoje konto klienta.</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Wpisz swój e-mail" required>
                </div>
                <div class="form-group">
                    <label for="password">Hasło</label>
                    <input type="password" id="password" name="password" placeholder="Wpisz swoje hasło" required>
                </div>

                <div id="loginError" class="auth-error" style="display: none; color: #ff4b4b; margin-bottom: 15px;">
                </div>

                <button type="submit" class="auth-btn">Zaloguj się</button>
            </form>

            <p class="auth-redirect">Nie masz jeszcze konta? <a href="register.html">Zarejestruj się</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin_panel.html';
                    } else {
                        window.location.href = 'customer_account.html';
                    }
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error('Błąd logowania:', err);
                errorDiv.textContent = 'Błąd połączenia z serwerem. Upewnij się, że otwierasz stronę przez http://localhost:3001, a nie bezpośrednio z pliku.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
